name: Build os-mypulse

on:
  repository_dispatch:
    types: [build_os_mypulse]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.2.3)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ryanstead/pulse-agent-opnsense
          token: ${{ secrets.UPSTREAM_PAT }}
          ref: ${{ inputs.tag || github.event.client_payload.ref }}

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: pkg install -y rust cargo
          run: sed -i 's|chmod 644.*olilo-mypulse-agent|chmod 644 /usr/local/sbin/olilo-mypulse-agent; chmod 755 /usr/local/sbin/olilo-mypulse-agent|' $(which build.sh || echo build.sh) && ./build.sh

      - name: Collect package
        run: |
          PKG=$(find releases -name 'os-mypulse-*.pkg' | head -1)
          cp "$PKG" os-mypulse.pkg
          sha256sum os-mypulse-$((echo ${GITHUB_REF#refs/tags/v})).*pkg > os-mypulse.pkg.sha256 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-mypulse
          path: os-mypulse.pkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: os-mypulse.pkg

      - name: Deploy pkg repo to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: pkg
          keep_files: false